<html>
<head>
    <title>SmartPark - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="background: linear-gradient(#0008,#0008), url('backGroundImage.png') center/cover;">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="logo.png" width="40" height="40" alt="Logo">
            SmartPark
        </a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
    </div>
</nav>
<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow p-4 w-100" style="max-width: 450px;">
        <h3 class="text-center mb-3">Create Account</h3>
        <form action="login.html">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control mb-2" required>
            <label class="form-label">Email</label>
            <input type="email" class="form-control mb-2" required>
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control mb-2" required>
            <label class="form-label">Password</label>
            <input type="password" class="form-control mb-2" required>
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control mb-3" required>
            <button type="submit" class="btn btn-danger w-100">Create Account</button>
        </form>
        <p class="text-center">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>
</div>
</body>
</html>
