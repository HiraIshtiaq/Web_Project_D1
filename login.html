<html>
<head>
    <title>SmartPark - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(#0008,#0008), url('backGroundImage.png') center/cover;">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="logo.png" width="40" height="40" alt="Logo">
            SmartPark
        </a>
        <a href="signup.html" class="btn btn-outline-light btn-sm">Sign Up</a>
    </div>
</nav>
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Welcome Back</h3>
        <form action="user.html">
            <label class="form-label">Email</label>
            <input type="email" class="form-control mb-3" required>
            <label class="form-label">Password</label>
            <input type="password" class="form-control mb-3" required>
            <label class="form-label">Login As</label>
            <select class="form-select mb-4">
                <option>User</option>
                <option>Admin</option>
            </select>
            <button class="btn btn-danger w-100">Login</button>
        </form>
        <p class="text-center">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
</div>
</body>
</html>
